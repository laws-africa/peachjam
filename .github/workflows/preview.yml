name: Preview

# Asks laws-africa/peachjam-preview for a preview environment when this PR carries a preview label, and for its
# teardown when the PR closes or loses the label. Everything else (build, deploy, comments) happens in that repo.
#
# Labels: `preview` runs lawlibrary.settings; `preview:<site>` runs <site>.settings (e.g. `preview:africanlii`).
# Each label is its own preview app; the data is the same anonymised lawlibrary copy for every site.
on:
  pull_request:
    types: [labeled, synchronize, reopened, closed, unlabeled]

permissions: {}

env:
  ORCHESTRATOR: laws-africa/peachjam-preview

jobs:
  preview:
    name: Request a preview or its teardown
    # a label event is about that one label; a push, reopen or close is about every preview label the PR carries
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          startsWith(github.event.label.name, 'preview')) ||
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
          contains(join(github.event.pull_request.labels.*.name, ' '), 'preview'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch for each preview label
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case $ACTION in
            labeled|unlabeled) labels=$LABEL ;;
            *) labels=$LABELS ;;
          esac
          case $ACTION in
            unlabeled|closed) workflow=preview-down; args=(-f reason="$ACTION") ;;
            *) workflow=preview-up; args=(-f head_sha="$HEAD_SHA" -f requested_by="$ACTOR") ;;
          esac
          for label in $labels; do
            [[ $label =~ ^preview(:[a-z0-9]+)?$ ]] || continue
            site=${label#preview:}; [ "$label" = preview ] && site=lawlibrary
            gh workflow run "$workflow.yml" -R "$ORCHESTRATOR" -f repo="$REPO" -f pr="$PR" -f site="$site" "${args[@]}"
            echo "$workflow $site: https://github.com/$ORCHESTRATOR/actions/workflows/$workflow.yml" >> "$GITHUB_STEP_SUMMARY"
          done
