name: Preview

# Asks laws-africa/peachjam-preview for a preview environment when this PR carries the `preview` label, and for its
# teardown when the PR closes or loses the label. Everything else (build, deploy, comments) happens in that repo.
on:
  pull_request:
    types: [labeled, synchronize, reopened, closed, unlabeled]

permissions: {}

env:
  ORCHESTRATOR: laws-africa/peachjam-preview

jobs:
  request:
    name: Request a preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preview-up
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: |
          gh workflow run preview-up.yml -R "$ORCHESTRATOR" \
            -f repo="${{ github.event.repository.name }}" \
            -f pr="${{ github.event.pull_request.number }}" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f requested_by="${{ github.actor }}"
          echo "Requested. Progress: https://github.com/$ORCHESTRATOR/actions/workflows/preview-up.yml" >> "$GITHUB_STEP_SUMMARY"

  teardown:
    name: Request teardown
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preview-down
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: |
          gh workflow run preview-down.yml -R "$ORCHESTRATOR" \
            -f repo="${{ github.event.repository.name }}" \
            -f pr="${{ github.event.pull_request.number }}" \
            -f reason="${{ github.event.action }}"
