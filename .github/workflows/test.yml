name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build a dependency-only image before the test matrix. The image contains
  # slow-to-install system tools and Python/Node dependencies, but never the
  # application source. Lint does not depend on this job and runs in parallel.
  build-ci-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      # This immutable tag changes only when an input copied into
      # Dockerfile.ci-base changes. Source-only pull requests reuse its image.
      - name: Set image reference
        id: image
        run: |
          dependency_hash=$(
            {
              shasum -a 256 Dockerfile.ci-base pyproject.toml package.json package-lock.json
              find bin -type f -print | LC_ALL=C sort | xargs shasum -a 256
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/peachjam-ci-base:deps-${dependency_hash}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/${GITHUB_REPOSITORY_OWNER}/peachjam-ci-base:cache" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CI base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci-base
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.cache }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # The mutable cache tag lets a new dependency hash reuse earlier
          # Docker layers, including the LibreOffice and other APT layers.
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}
          cache-to: type=inline

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-python-3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install lint deps
        run: |
          python -m pip install --upgrade "setuptools<82" wheel
          pip install "pre-commit>=2.17.0"
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    needs: build-ci-base
    runs-on: ubuntu-latest
    # Each matrix job pulls the same dependency image. Postgres is a sibling
    # service container, so it is available as hostname "postgres" below.
    container:
      image: ${{ needs.build-ci-base.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        app: [peachjam, liiweb]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - uses: actions/checkout@v4
      # The image intentionally excludes application source. This editable, no-dependency install ensures tests run
      # the pull request's code, using dependencies from the pre-built image.
      - name: Install checked-out source
        run: pip install --no-deps -e .
      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/peach-jam
          TEST_RUNNER: xmlrunner.extra.djangotestrunner.XMLTestRunner
        run: |
          coverage run manage.py test peachjam_subs peachjam_search ${{ matrix.app }} --settings=${{ matrix.app }}.settings
      - name: Generate coverage report
        if: success() || failure()
        run: |
          if [ -f .coverage ]; then
            coverage xml -o coverage-${{ matrix.app }}.xml
          fi
      - name: Publish coverage to Coveralls
        if: ${{ hashFiles(format('coverage-{0}.xml', matrix.app)) != '' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage-${{ matrix.app }}.xml
          format: cobertura
          flag-name: ${{ matrix.app }}
          parallel: true

  coveralls-finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Coveralls parallel build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
