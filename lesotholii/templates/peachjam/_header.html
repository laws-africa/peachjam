{% extends 'peachjam/_header.html' %}
{% load i18n %}
{% block nav-items %}
  <li class="nav-item">
    <a data-key-link="home_page"
       class="nav-link {% if view.navbar_link == 'home' %}active{% endif %}"
       href="{% url 'home_page' %}">
    {% trans 'Home' %}</a>
  </li>
  <li class="nav-item">
    <a data-key-link="judgment_list"
       class="nav-link {% if view.navbar_link == 'judgments' %}active{% endif %}"
       href="{% url 'judgment_list' %}">
      {% trans 'Judgments' %}
    </a>
  </li>
  <li class="nav-item">
    <a data-key-link="legislation_list"
       class="nav-link {% if view.navbar_link == 'legislation' %}active{% endif %}"
       href="{% url 'legislation_list' %}">
      {% trans 'Legislation' %}
    </a>
  </li>
  <li class="nav-item">
    <a data-key-link="about"
       class="nav-link {% if view.navbar_link == 'about' %}active{% endif %}"
       href="{% url 'about' %}">
      {% trans 'About' %}
    </a>
  </li>
  <li class="nav-item ms-auto">
    <a data-key-link="help"
       class="nav-link"
       href="{{ PEACHJAM_SETTINGS.user_help_link }}">{% trans 'Help' %}</a>
  </li>
{% endblock %}
