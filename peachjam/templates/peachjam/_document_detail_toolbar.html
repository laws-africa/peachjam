{% load i18n %}
<div class="btn-toolbar mb-3 document-detail-toolbar"
     role="toolbar"
     aria-label="{% trans "Document toolbar" %}"
     data-document-id="{{ document.id }}"
     hx-get="{% url 'document_toolbar' document.pk %}"
     hx-trigger="load"
     hx-swap="innerHTML">
  <span class="visually-hidden">{% trans "Loading document controls..." %}</span>
</div>
